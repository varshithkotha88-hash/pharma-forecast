<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 1rem;
        }

        .joke-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .joke-container.loading {
            background: linear-gradient(135deg, #e0e0e0 0%, #c3cfe2 100%);
            opacity: 0.7;
        }

        .joke-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .joke-text {
            font-size: 1.2rem;
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .joke-setup {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .joke-delivery {
            font-size: 1.1rem;
            color: #667eea;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(102, 126, 234, 0.3);
            font-weight: 600;
        }

        .loading-text {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            border-color: #667eea;
            color: #667eea;
        }

        .filter-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .filter-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .filter-option {
            display: flex;
            align-items: center;
        }

        .filter-option input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .filter-option label {
            cursor: pointer;
            font-size: 0.95rem;
            color: #555;
            flex: 1;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c62828;
        }

        .error.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .joke-text {
                font-size: 1rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .filter-options {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>😂 Joke Generator</h1>
                <p>Get random jokes from the internet</p>
            </div>

            <div class="error" id="errorMessage"></div>

            <div class="filter-section">
                <h3>Joke Type</h3>
                <div class="filter-options">
                    <div class="filter-option">
                        <input type="radio" id="typeAll" name="jokeType" value="all" checked>
                        <label for="typeAll">Any Type</label>
                    </div>
                    <div class="filter-option">
                        <input type="radio" id="typeGeneral" name="jokeType" value="general">
                        <label for="typeGeneral">General</label>
                    </div>
                    <div class="filter-option">
                        <input type="radio" id="typeKnock" name="jokeType" value="knock-knock">
                        <label for="typeKnock">Knock-Knock</label>
                    </div>
                    <div class="filter-option">
                        <input type="radio" id="typeProgramming" name="jokeType" value="programming">
                        <label for="typeProgramming">Programming</label>
                    </div>
                </div>
            </div>

            <div class="joke-container" id="jokeContainer">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading a joke...</div>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="getJoke()">Get Another Joke 😄</button>
                <button class="btn-secondary" onclick="copyToClipboard()">Copy</button>
                <button class="btn-secondary" onclick="shareJoke()">Share</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="jokeCount">0</div>
                    <div class="stat-label">Jokes Loaded</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="categoryCount">Multiple</div>
                    <div class="stat-label">Categories</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentJoke = null;
        let jokeCount = 0;
        const API_URL = 'https://official-joke-api.appspot.com/random_joke';
        const CATEGORY_API_URL = 'https://official-joke-api.appspot.com/jokes';

        const typeRadios = document.querySelectorAll('input[name="jokeType"]');
        typeRadios.forEach(radio => {
            radio.addEventListener('change', getJoke);
        });

        async function getJoke() {
            const jokeContainer = document.getElementById('jokeContainer');
            const errorMessage = document.getElementById('errorMessage');

            jokeContainer.classList.add('loading');
            errorMessage.classList.remove('show');

            try {
                const jokeType = document.querySelector('input[name="jokeType"]:checked').value;
                let url = API_URL;

                if (jokeType !== 'all') {
                    url = `${CATEGORY_API_URL}/${jokeType}/random`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch joke');

                let data = await response.json();

                // Handle array response
                if (Array.isArray(data)) {
                    data = data[0];
                }

                currentJoke = data;
                jokeCount++;
                displayJoke(data);
                updateStats();
            } catch (error) {
                showError('Failed to load joke. Please try again!');
                console.error('Error:', error);
            }
        }

        function displayJoke(joke) {
            const jokeContainer = document.getElementById('jokeContainer');
            jokeContainer.classList.remove('loading');

            let jokeHTML = `<div class="joke-type">${joke.type || 'General'}</div>`;

            if (joke.setup && joke.delivery) {
                // Two-part joke
                jokeHTML += `
                    <div class="joke-setup">${joke.setup}</div>
                    <div class="joke-delivery">${joke.delivery}</div>
                `;
            } else if (joke.joke) {
                // Single joke
                jokeHTML += `<div class="joke-text">${joke.joke}</div>`;
            } else {
                // Fallback
                jokeHTML += `<div class="joke-text">${joke}</div>`;
            }

            jokeContainer.innerHTML = jokeHTML;
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function copyToClipboard() {
            if (!currentJoke) {
                showError('No joke to copy!');
                return;
            }

            let textToCopy = '';
            if (currentJoke.setup && currentJoke.delivery) {
                textToCopy = `${currentJoke.setup}\n\n${currentJoke.delivery}`;
            } else if (currentJoke.joke) {
                textToCopy = currentJoke.joke;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(() => {
                showError('Failed to copy to clipboard');
            });
        }

        function shareJoke() {
            if (!currentJoke) {
                showError('No joke to share!');
                return;
            }

            let textToShare = '';
            if (currentJoke.setup && currentJoke.delivery) {
                textToShare = `${currentJoke.setup}\n\n${currentJoke.delivery}`;
            } else if (currentJoke.joke) {
                textToShare = currentJoke.joke;
            }

            if (navigator.share) {
                navigator.share({
                    title: 'Check out this joke!',
                    text: textToShare
                }).catch(err => console.log('Error sharing:', err));
            } else {
                showError('Sharing not supported on your browser');
            }
        }

        function updateStats() {
            document.getElementById('jokeCount').textContent = jokeCount;
        }

        // Load initial joke
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
